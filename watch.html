<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Anvelope Ungheni — Video Ad (HyperFrames)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0A0A09;
      color: #FAF8F5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 14px 40px;
    }
    .wrap {
      width: 100%;
      max-width: 960px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      border-bottom: 1px solid #2E2C29;
      padding-bottom: 14px;
      margin-bottom: 18px;
    }
    .title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }
    .badge {
      background: #D40608;
      color: #fff;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 3px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }
    video {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #121211;
      border: 1px solid #2E2C29;
      border-radius: 4px;
      display: block;
      margin-bottom: 16px;
    }
    .actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 18px;
      background: #D40608;
      color: #fff;
      font-weight: 700;
      font-size: 15px;
      text-decoration: none;
      border-radius: 3px;
    }
    .btn-sec {
      background: #1C1B19;
      border: 1px solid #494640;
      color: #FAF8F5;
    }
    .sheet-title {
      font-size: 14px;
      color: #9B968C;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 10px;
    }
    .sheet {
      width: 100%;
      border: 1px solid #2E2C29;
      border-radius: 4px;
      display: block;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title">Anvelope Ungheni · Schimbul de Anvelope (24s · 1080p)</div>
      <div class="badge">HyperFrames v0.9.80</div>
    </div>
    <video controls playsinline preload="metadata" poster="https://raw.githubusercontent.com/raunchy1/Generare-video-/hyperframes-ad/contact-sheet.jpg">
      <source src="https://raw.githubusercontent.com/raunchy1/Generare-video-/hyperframes-ad/anvelope-ungheni-ad.mp4" type="video/mp4" />
    </video>
    <div class="actions">
      <a class="btn" href="https://raw.githubusercontent.com/raunchy1/Generare-video-/hyperframes-ad/anvelope-ungheni-ad.mp4" download="anvelope-ungheni-ad.mp4">⬇ Descarcă MP4 (5.6 MB)</a>
      <a class="btn btn-sec" href="https://github.com/raunchy1/Generare-video-/tree/hyperframes-ad" target="_blank">Vezi fișierele pe GitHub</a>
    </div>
    <div class="sheet-title">Planșă de control — cele 6 scene (2s · 6s · 10s · 14s · 18s · 22s)</div>
    <img class="sheet" src="https://raw.githubusercontent.com/raunchy1/Generare-video-/hyperframes-ad/contact-sheet.jpg" alt="Contact sheet" />
  </div>
</body>
</html>
