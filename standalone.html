<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Product Showcase</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#08080f;display:flex;align-items:center;justify-content:center;min-height:100vh;overflow:hidden}
  canvas{max-width:100vw;max-height:100vh;object-fit:contain}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
// ── Canvas setup ──────────────────────────────────────────────────────────
const canvas = document.getElementById('c');
const W = 1920, H = 1080, FPS = 30, DURATION = 10;
canvas.width  = W;
canvas.height = H;
const ctx = canvas.getContext('2d');

// ── Helpers (reimplementing interpolate + spring without external libs) ────
function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

function interpolate(v, input, output){
  const [i0,i1] = input, [o0,o1] = output;
  const t = clamp((v - i0) / (i1 - i0), 0, 1);
  return o0 + t * (o1 - o0);
}

// Simple spring simulation (Euler integration, matches Helios defaults)
function springValue(frame, fps, from, to, stiffness=60, damping=12, mass=1){
  let pos = from, vel = 0;
  const dt = 1 / fps;
  const steps = Math.max(0, frame);
  for(let i = 0; i < steps; i++){
    const force = -stiffness * (pos - to) - damping * vel;
    vel += (force / mass) * dt;
    pos += vel * dt;
  }
  return pos;
}

// ── Particles (deterministic, seeded) ──────────────────────────────────────
const PARTICLES = Array.from({length:120}, (_,i) => {
  const s = (i * 2654435761) >>> 0;
  const r = n => ((s ^ (s >> n)) % 1000) / 1000;
  return { x: r(3)*W, y: r(7)*H, radius: 1+r(11)*3, speed: 0.3+r(13)*0.8,
           hue: 200+r(17)*100, alpha: 0.15+r(19)*0.45, drift: (r(23)-0.5)*0.4 };
});

function drawParticles(frame){
  PARTICLES.forEach(p => {
    const y = ((p.y - p.speed*frame) % H + H) % H;
    const x = p.x + p.drift*frame;
    const g = ctx.createRadialGradient(x,y,0, x,y, p.radius*2.5);
    g.addColorStop(0, `hsla(${p.hue},80%,70%,${p.alpha})`);
    g.addColorStop(1, `hsla(${p.hue},80%,70%,0)`);
    ctx.beginPath(); ctx.arc(x,y,p.radius*2.5,0,Math.PI*2);
    ctx.fillStyle = g; ctx.fill();
  });
}

// ── Background ────────────────────────────────────────────────────────────
function drawBg(frame){
  ctx.fillStyle='#08080f'; ctx.fillRect(0,0,W,H);
  const pulse = 0.5+0.5*Math.sin((frame/FPS)*Math.PI*0.4);
  const a = 0.12+pulse*0.06;
  const g = ctx.createRadialGradient(W*.62,H*.5,0, W*.62,H*.5,700);
  g.addColorStop(0, `rgba(124,111,247,${a})`);
  g.addColorStop(1, 'rgba(124,111,247,0)');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  drawParticles(frame);
}

// ── roundRect helper ──────────────────────────────────────────────────────
function rr(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y);
  ctx.quadraticCurveTo(x+w,y, x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h, x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h, x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y, x+r,y);
  ctx.closePath();
}

// ── Product phone ─────────────────────────────────────────────────────────
function drawProduct(cx,cy,opacity){
  ctx.save(); ctx.globalAlpha=opacity;
  const pw=260,ph=520,pr=36;
  ctx.shadowColor='rgba(124,111,247,.5)'; ctx.shadowBlur=60; ctx.shadowOffsetY=20;
  const bg=ctx.createLinearGradient(cx-pw/2,cy-ph/2, cx+pw/2,cy+ph/2);
  bg.addColorStop(0,'#1e1b3a'); bg.addColorStop(1,'#0d0c1e');
  rr(ctx,cx-pw/2,cy-ph/2,pw,ph,pr); ctx.fillStyle=bg; ctx.fill();
  ctx.shadowBlur=0; ctx.strokeStyle='rgba(255,255,255,.08)'; ctx.lineWidth=1.5;
  rr(ctx,cx-pw/2,cy-ph/2,pw,ph,pr); ctx.stroke();
  const sp=14;
  const sg=ctx.createLinearGradient(cx-pw/2+sp,cy-ph/2+60, cx+pw/2-sp,cy+ph/2-sp);
  sg.addColorStop(0,'#1a103a'); sg.addColorStop(.5,'#120c2e'); sg.addColorStop(1,'#0a0718');
  rr(ctx,cx-pw/2+sp,cy-ph/2+60,pw-sp*2,ph-80,22); ctx.fillStyle=sg; ctx.fill();
  ctx.fillStyle='#0a0718';
  ctx.beginPath(); ctx.arc(cx,cy-ph/2+30,12,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='#1a1240';
  ctx.beginPath(); ctx.arc(cx,cy-ph/2+30,7,0,Math.PI*2); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.25)';
  ctx.beginPath(); ctx.arc(cx-2,cy-ph/2+27,2.5,0,Math.PI*2); ctx.fill();
  const lx=cx-pw/2+sp+18, lw=pw-sp*2-36, ly=cy-ph/2+105;
  ctx.fillStyle='rgba(124,111,247,.15)'; ctx.fillRect(lx,ly,lw,3);
  [.85,.85,.6,.85,.4].forEach((bw,i)=>{
    const a=0.07+(5-i)*0.04;
    ctx.fillStyle=`rgba(180,170,255,${a})`;
    ctx.beginPath(); ctx.roundRect(lx,ly+28+i*52,lw*bw,10,5); ctx.fill();
  });
  const cg=ctx.createLinearGradient(lx,ly+155, lx+lw,ly+215);
  cg.addColorStop(0,'rgba(124,111,247,.3)'); cg.addColorStop(1,'rgba(80,60,200,.2)');
  ctx.fillStyle=cg; ctx.beginPath(); ctx.roundRect(lx,ly+155,lw,58,10); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.2)';
  ctx.beginPath(); ctx.roundRect(cx-50,cy+ph/2-38,100,4,2); ctx.fill();
  ctx.restore();
}

// ── Price ─────────────────────────────────────────────────────────────────
function drawPrice(cx,cy,val,opacity){
  ctx.save(); ctx.globalAlpha=opacity;
  ctx.shadowColor='#7c6ff7'; ctx.shadowBlur=40;
  ctx.font='bold 128px system-ui,sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillStyle='#ffffff';
  ctx.fillText('$'+Math.round(val), cx, cy);
  ctx.restore();
}

// ── Labels ────────────────────────────────────────────────────────────────
function drawLabels(cx,cy,opacity){
  ctx.save(); ctx.globalAlpha=opacity; ctx.textAlign='center';
  ctx.font='bold 56px system-ui,sans-serif'; ctx.fillStyle='#fff';
  ctx.shadowColor='rgba(124,111,247,.6)'; ctx.shadowBlur=20;
  ctx.fillText('AuraPhone Pro', cx, cy-50);
  ctx.font='28px system-ui,sans-serif'; ctx.fillStyle='rgba(180,170,255,.75)';
  ctx.shadowBlur=0;
  ctx.fillText('Reimagined. Refined. Ready.', cx, cy+10);
  ctx.restore();
}

// ── Divider ───────────────────────────────────────────────────────────────
function drawDivider(cx,cy,opacity){
  ctx.save(); ctx.globalAlpha=opacity*.35;
  const g=ctx.createLinearGradient(cx-200,cy, cx+200,cy);
  g.addColorStop(0,'transparent'); g.addColorStop(.5,'rgba(124,111,247,.8)'); g.addColorStop(1,'transparent');
  ctx.strokeStyle=g; ctx.lineWidth=1;
  ctx.beginPath(); ctx.moveTo(cx-200,cy); ctx.lineTo(cx+200,cy); ctx.stroke();
  ctx.restore();
}

// ── Badge ─────────────────────────────────────────────────────────────────
function drawBadge(cx,cy,opacity){
  ctx.save(); ctx.globalAlpha=opacity;
  const bw=220,bh=54,br=27,bx=cx-bw/2,by=cy-bh/2;
  const g=ctx.createLinearGradient(bx,by, bx+bw,by);
  g.addColorStop(0,'#7c6ff7'); g.addColorStop(1,'#5b4de0');
  ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(bx,by,bw,bh,br); ctx.fill();
  ctx.font='bold 22px system-ui,sans-serif'; ctx.textAlign='center';
  ctx.textBaseline='middle'; ctx.fillStyle='#fff';
  ctx.fillText('Buy Now →', cx, cy);
  ctx.restore();
}

// ── Main render ───────────────────────────────────────────────────────────
function render(frame){
  const productCX=W*.28, productCY=H*.50, infoCX=W*.65;

  const productX   = interpolate(frame,[0,60],[productCX-500,productCX]);
  const productOp  = interpolate(frame,[0,60],[0,1]);
  const infoOp     = interpolate(frame,[24,72],[0,1]);
  const priceVal   = springValue(Math.max(0,frame-45), FPS, 0, 299);
  const priceOp    = interpolate(frame,[45,75],[0,1]);
  const badgeOp    = interpolate(frame,[120,150],[0,1]);
  const badgeY     = interpolate(frame,[120,150],[H*.78+30,H*.78]);

  drawBg(frame);
  drawProduct(productX, productCY, productOp);
  drawLabels(infoCX, H*.40, infoOp);
  drawDivider(infoCX, H*.535, infoOp);
  drawPrice(infoCX, H*.60, priceVal, priceOp);
  drawBadge(infoCX, badgeY, badgeOp);
}

// ── Playback loop ─────────────────────────────────────────────────────────
let frame=0, lastTime=null, running=true;
const TOTAL = FPS*DURATION;

function loop(ts){
  if(!lastTime) lastTime=ts;
  const elapsed=(ts-lastTime)/1000;
  if(elapsed >= 1/FPS){
    render(Math.min(frame,TOTAL));
    frame = (frame+1) % (TOTAL+1);
    lastTime=ts;
  }
  if(running) requestAnimationFrame(loop);
}

render(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
